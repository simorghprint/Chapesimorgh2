
<section id="online-order" style="
background:linear-gradient(135deg,#14264d,#2765a5);
padding:50px 20px;
text-align:center;
color:white;
">
  <h2 style="color:#ffc43d;font-size:27px">
    ثبت سفارش آنلاین
  </h2>

  <p style="line-height:2">
    برای ثبت سفارش، نوع خدمات موردنظر خود را انتخاب کنید
    و از طریق واتساپ با ما در ارتباط باشید.
  </p>

  <div style="max-width:420px;margin:25px auto">

    <select id="orderType" style="
    width:100%;
    padding:16px;
    border-radius:10px;
    border:0;
    font-size:16px;
    font-family:Tahoma;
    margin-bottom:18px;
    direction:rtl;
    ">
      <option value="">انتخاب نوع سفارش</option>
      <option>چاپ بنر</option>
      <option>بنر تسلیت و آگهی ترحیم</option>
      <option>چاپ ماگ</option>
      <option>کارت عروسی</option>
      <option>چاپ استیکر و وینیل</option>
      <option>ساخت مهر اتوماتیک و لیزری</option>
      <option>چاپ تیشرت</option>
      <option>سایر خدمات چاپ</option>
    </select>

    <button onclick="sendOrder()" style="
    width:100%;
    padding:17px;
    border:0;
    border-radius:10px;
    background:#ffc43d;
    color:#14264d;
    font-size:18px;
    font-weight:bold;
    font-family:Tahoma;
    cursor:pointer;
    ">
      ثبت سفارش از طریق واتساپ
    </button>

  </div>

  <p style="font-size:13px">
    چاپخانه سیمرغ | آماده دریافت سفارش‌های شما
  </p>
</section>

<script>
function sendOrder() {
  const service = document.getElementById("orderType").value;

  if (!service) {
    alert("لطفاً نوع سفارش خود را انتخاب کنید");
    return;
  }

  const message =
    "سلام، وقت بخیر\n" +
    "می‌خواهم از چاپخانه سیمرغ سفارش ثبت کنم.\n" +
    "نوع سفارش من: " + service +
    "\nلطفاً راهنمایی بفرمایید.";

  const url =
    "https://wa.me/989189023896?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");
}
</script>
